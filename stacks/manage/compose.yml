services:
  dockge:
    image: louislam/dockge:1
    container_name: dockge
    restart: unless-stopped
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "dockge_data:/app/data"
      - "${STACKS_DIR}:${STACKS_DIR}"
    environment:
      - "DOCKGE_STACKS_DIR=${STACKS_DIR}"
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    ports:
      - "${TAILSCALE_IP}:5001:5001"

volumes:
  dockge_data: